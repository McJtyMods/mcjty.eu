name: Checks
description: Run lint, type check and unused code check
runs:
  using: composite
  steps:
    - name: Lint
      run: pnpm run lint:ci
      shell: bash

    - name: TypeScript type check
      run: pnpm --filter @mcjty-website/www run typecheck
      shell: bash

    - name: Unused code
      run: pnpm run unused
      shell: bash
